name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # MPI is only needed for the Python 3.12 job.
      - name: Install OpenMPI
        if: matrix.python-version == '3.12'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openmpi-bin libopenmpi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest coverage

      - name: Install mpi4py
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install mpi4py

      - name: Run standard tests with coverage
        run: |
          coverage erase
          coverage run --parallel-mode -m pytest tests/normal_tests

      - name: Run MPI tests with coverage
        if: matrix.python-version == '3.12'
        env:
          OMPI_MCA_rmaps_base_oversubscribe: 1
        run: |
          # Serial MPI execution
          mpirun -n 1 --oversubscribe \
            coverage run --parallel-mode -m pytest -q tests/mpi_tests

          # Parallel MPI execution
          mpirun -n 3 --oversubscribe \
            coverage run --parallel-mode -m pytest -q tests/mpi_tests

      - name: Generate coverage report
        if: success()
        run: |
          coverage combine
          coverage report -m
          coverage xml -o coverage.xml

      - name: Save coverage to summary
        if: success()
        run: |
          echo "## Coverage Report (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          coverage report -m >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage reports to Codecov
        if: success() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          slug: knaidoo29/SHIFT
