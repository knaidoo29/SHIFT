name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel all matrix jobs if one fails
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install MPI and system deps
        run: |
          sudo apt-get update
          # Use OpenMPI instead of MPICH — OpenMPI supports --oversubscribe,
          # which is required to run 3 ranks on a 2-core GitHub Actions runner.
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov coverage mpi4py

      # Required for coverage to start in MPI subprocesses.
      # coverage needs a sitecustomize.py hook to activate in spawned processes.
      - name: Configure coverage for subprocess support
        run: |
          python -m coverage --version

          SITE_PACKAGES=$(python -c "import site; print(site.getsitepackages()[0])")
          cat > "$SITE_PACKAGES/sitecustomize.py" << 'EOF'
          import coverage
          coverage.process_startup()
          EOF

      - name: Run tests with coverage
        env:
          COVERAGE_PROCESS_START: .coveragerc
          # Suppress OpenMPI warnings about oversubscription
          OMPI_MCA_rmaps_base_oversubscribe: 1
        run: |
          coverage erase
      
          # Run standard tests
          coverage run --parallel-mode -m pytest tests/normal_tests
      
          # Run MPI tests with 1 rank to cover serial execution
          mpirun -n 1 --oversubscribe coverage run --parallel-mode -m pytest -s -v tests/mpi_tests
      
          # Run MPI tests with 3 ranks to cover parallel execution
          mpirun -n 3 --oversubscribe coverage run --parallel-mode -m pytest -s -v tests/mpi_tests
      
          # Merge all .coverage.* files produced by parallel/MPI runs
          coverage combine

      - name: Generate coverage report
        # Always generate even if tests had failures, so we can diagnose
        if: always()
        run: |
          coverage report -m
          coverage xml -o coverage.xml

      - name: Save coverage to summary
        if: always()
        run: |
          echo "## Coverage Report (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          coverage report -m >> $GITHUB_STEP_SUMMARY

      # Only upload to Codecov once, from the latest Python version, on success
      - name: Upload coverage reports to Codecov
        if: success() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          slug: knaidoo29/SHIFT
